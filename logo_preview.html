<title>PhantomHub Logo</title>
<style>
  :root {
    --ground: #0a0a0a;
    --surface: #111113;
    --text: #999;
    --text-dim: #555;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
  }
  .logo-wrap {
    width: 320px;
    height: 320px;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(255,255,255,0.03), 0 0 1px rgba(255,255,255,0.1);
  }
  .logo-wrap svg { width: 100%; height: 100%; display: block; }
  .hint {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
</style>

<div class="logo-wrap">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
      <radialGradient id="bg" cx="50%" cy="40%" r="60%">
        <stop offset="0%" style="stop-color:#1a1a1a"/>
        <stop offset="100%" style="stop-color:#050505"/>
      </radialGradient>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#ffffff"/>
        <stop offset="100%" style="stop-color:#bbbbbb"/>
      </linearGradient>
      <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#444444"/>
        <stop offset="50%" style="stop-color:#222222"/>
        <stop offset="100%" style="stop-color:#444444"/>
      </linearGradient>
    </defs>
    <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
    <circle cx="256" cy="256" r="248" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
    <circle cx="256" cy="256" r="230" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="4,8"/>
    <g opacity="0.03">
      <line x1="256" y1="30" x2="256" y2="482" stroke="#fff" stroke-width="0.5"/>
      <line x1="30" y1="256" x2="482" y2="256" stroke="#fff" stroke-width="0.5"/>
    </g>
    <g opacity="0.04">
      <path d="M256,80 C330,80 380,130 380,210 L380,370 C380,380 370,385 365,375 L355,355 C350,345 340,345 335,355 L325,375 C320,385 310,385 305,375 L295,355 C290,345 280,345 275,355 L265,375 C260,385 250,385 245,375 L235,355 C230,345 220,345 215,355 L205,375 C200,385 190,385 185,375 L175,355 C170,345 160,345 155,355 L145,375 C140,385 130,380 130,370 L130,210 C130,130 180,80 256,80Z" fill="#fff"/>
    </g>
    <g filter="url(#glow)">
      <path d="M120,168 L120,358 L152,358 L152,286 L204,286 C256,286 278,260 278,226 C278,192 256,168 204,168 Z M152,196 L199,196 C233,196 246,210 246,226 C246,243 233,258 199,258 L152,258 Z" fill="url(#textGrad)"/>
      <path d="M300,168 L300,358 L332,358 L332,276 L388,276 L388,358 L420,358 L420,168 L388,168 L388,248 L332,248 L332,168 Z" fill="url(#textGrad)"/>
    </g>
    <rect x="120" y="374" width="300" height="2" rx="1" fill="#fff" opacity="0.15"/>
    <circle cx="256" cy="60" r="2" fill="#fff" opacity="0.15"/>
    <circle cx="256" cy="452" r="2" fill="#fff" opacity="0.15"/>
    <circle cx="60" cy="256" r="2" fill="#fff" opacity="0.15"/>
    <circle cx="452" cy="256" r="2" fill="#fff" opacity="0.15"/>
  </svg>
</div>
<p class="hint">right-click the logo → save image as</p>
